name: Build Zombie Rush 3D Play Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erstellen
        run: npx cap add android

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android APK und AAB bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: APK speichern
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Rush-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: AAB speichern
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Rush-3D-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error