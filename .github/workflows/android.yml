name: Build Zombie Rush 3D Play Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Capacitor CLI prüfen
        run: |
          node --version
          npm --version
          test -x node_modules/.bin/cap
          node_modules/.bin/cap --version

      - name: Android-Projekt erstellen
        run: node_modules/.bin/cap add android

      - name: Capacitor synchronisieren
        run: node_modules/.bin/cap sync android

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Play-Store AAB bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleDebug

      - name: Android-Ausgaben anzeigen
        if: always()
        run: |
          echo "=== Android build outputs ==="
          find android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
          echo "=== Alle AAB/APK Dateien ==="
          find android -type f \( -name '*.aab' -o -name '*.apk' \) -print 2>/dev/null || true

      - name: AAB als GitHub-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Rush-3D-Play-Store-AAB
          path: |
            android/**/*.aab
            android/**/*.apk
          if-no-files-found: error
          retention-days: 14
