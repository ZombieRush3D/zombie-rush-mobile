name: Build Zombie Rush 3D Play Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Capacitor CLI prüfen
        run: |
          node --version
          npm --version
          test -x node_modules/.bin/cap
          node_modules/.bin/cap --version

      - name: Android-Projekt erstellen
        run: node_modules/.bin/cap add android

      - name: Capacitor synchronisieren
        run: node_modules/.bin/cap sync android

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Play-Store AAB bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleDebug

      - name: AAB prüfen
        run: |
          echo "Gefundene AAB-Dateien:"
          find android/app/build/outputs -type f -name '*.aab' -print
          test -f android/app/build/outputs/bundle/debug/app-debug.aab
          ls -lh android/app/build/outputs/bundle/debug/app-debug.aab

      - name: AAB als GitHub-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Rush-3D-Play-Store-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
