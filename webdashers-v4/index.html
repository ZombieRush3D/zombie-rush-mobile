  function matching(url){for(var i=0;i<HOSTS.length;i++) if(url.indexOf(HOSTS[i])===0) return HOSTS[i]; return null;}
  function swap(url,a,b){return b+url.slice(a.length);}
  window.fetch=function(input,init){
    var isReq=typeof Request!=="undefined"&&input instanceof Request, url=isReq?input.url:input;
    if(typeof url!=="string") return nativeFetch(input,init);
    var old=matching(url); if(!old) return nativeFetch(input,init);
    var tries=0;
    function go(i){var host=HOSTS[i], u=swap(url,old,host), inp=isReq?new Request(u,input):u;

    return go(active);
  };
})();
